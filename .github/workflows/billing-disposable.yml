name: Disposable billing validation
on:
  pull_request:
    branches: [codex/digital-ranch-continuation, codex/takeover-audit]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: billing-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.repository == 'kks787-ship-it/KksSandbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record literal tested commit and tree
        run: git rev-parse HEAD HEAD^{tree}
      - name: Install guard-test prerequisite on disposable runner
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint && composer phpcs
      - name: Native PHP billing contracts and deployment guards
        env:
          BILLING_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          docker build --build-arg CSF_TEST_PHP_VERSION="$BILLING_PHP" -t csf-billing-contracts tests/scheduling
          for suite in domain service value fulfillment dispatch mime booking schema session recovery-missing-key; do
            docker run --rm --network none --read-only -v "$PWD:/repo:ro" -w /repo csf-billing-contracts php "tests/billing/$suite.php"
          done
          bash tests/scripts/development-guards.sh
          bash tests/scripts/plesk-preflight.sh
  qualified-recovery:
    if: github.repository == 'kks787-ship-it/KksSandbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record literal tested commit and tree
        run: git rev-parse HEAD HEAD^{tree}
      - run: bash tests/billing/ci-prepare.sh
      - name: Unchanged qualified scheduling recovery and failure gates
        env:
          CSF_RECOVERY_PHP_VARIANT: '83'
        run: bash tests/recovery/restore-local.sh
  combined-recovery:
    if: github.repository == 'kks787-ship-it/KksSandbox'
    needs: [contracts, qualified-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record literal tested commit and tree
        run: git rev-parse HEAD HEAD^{tree}
      - run: bash tests/billing/ci-prepare.sh
      - name: Candidate combined 33-table exact-pinned-runtime rehearsal
        env:
          CSF_RECOVERY_PHP_VARIANT: '83'
        run: bash tests/billing/combined-recovery.sh
